<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>SLC admin</title>
<link rel="icon" href="images/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/market.css">
<style>
  body{background:var(--bg);color:var(--text);font-family:var(--font-body);margin:0;padding:24px 16px}
  main{max-width:760px;margin:0 auto}
  h1{font:800 24px/1.2 var(--font-display);margin:0 0 4px}
  .adm-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin:14px 0}
  .adm-card h2{font:700 17px/1.3 var(--font-display);margin:0 0 4px}
  .adm-meta{color:var(--muted);font-size:14px;margin:0 0 8px}
  .adm-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .adm-form label{display:block;font-weight:600;margin:12px 0 4px}
  .adm-form input{width:100%;box-sizing:border-box;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text);font-size:16px}
  .adm-msg{min-height:22px;margin:10px 0 0;color:var(--danger,#c0392b)}
</style>
</head>
<body>
<main>
  <h1>SLC admin</h1>
  <p class="adm-meta">Review paid ads and verify students.</p>

  <section id="login" class="adm-card adm-form" hidden>
    <label for="em">Email</label><input id="em" type="email" autocomplete="username">
    <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password">
    <p class="adm-msg" id="loginMsg" role="alert"></p>
    <div class="adm-row"><button class="btn primary" type="button" id="go">Sign in</button><button class="btn" type="button" id="showReg">Create admin account</button></div>
  </section>

  <section id="register" class="adm-card adm-form" hidden>
    <h2>Create an admin account</h2>
    <p class="adm-meta">You need the admin sign-up code that was set in the hosting settings.</p>
    <label for="rem">Email</label><input id="rem" type="email" autocomplete="username">
    <label for="rpw">Password (at least 12 characters)</label><input id="rpw" type="password" autocomplete="new-password">
    <label for="rcd">Admin sign-up code</label><input id="rcd" type="password" autocomplete="off">
    <p class="adm-msg" id="regMsg" role="alert"></p>
    <div class="adm-row"><button class="btn primary" type="button" id="goReg">Create account</button><button class="btn" type="button" id="backLogin">Back to sign in</button></div>
  </section>

  <section id="list" hidden>
    <div class="adm-row"><button class="btn sm primary" type="button" id="tabAds">Ads</button><button class="btn sm" type="button" id="tabStu">Students</button><button class="btn sm" type="button" id="refresh">Refresh</button></div>
    <div id="ads"></div>
    <div id="students" hidden>
      <p class="adm-meta">Verify a student, or decline them: declining signs them out at once and deletes their account.</p>
      <div class="adm-row"><button class="btn sm primary" type="button" data-filter="waiting">Waiting</button><button class="btn sm" type="button" data-filter="verified">Verified</button></div>
      <div id="stuList"></div>
    </div>
  </section>
</main>
<script src="js/admin.js"></script>
</body>
</html>
