#slcLoader{display:none;position:fixed;inset:0;z-index:2000;align-items:center;justify-content:center;flex-direction:column;gap:18px;background:var(--bg,#eef2f8);color:var(--text,#0c1a2e);visibility:visible;opacity:1;transition:opacity .35s ease}
html.slc-splash #slcLoader{display:flex}
html.slc-loaded #slcLoader{opacity:0;pointer-events:none}
#slcLoader .slcl-mark{position:relative;width:104px;height:104px;display:grid;place-items:center}
#slcLoader .slcl-mark img{width:84px;height:84px;border-radius:50%;display:block;animation:slclPulse 1.8s ease-in-out infinite}
#slcLoader .slcl-ring{position:absolute;inset:0;border-radius:50%;border:3px solid var(--line,#d5deec);border-top-color:#2f6df6;animation:slclSpin .9s linear infinite}
#slcLoader .slcl-name{margin:0;font:600 18px/1.2 var(--font-display,system-ui,sans-serif);letter-spacing:.02em}
#slcLoader .slcl-sub{margin:-10px 0 0;font-size:14px;color:var(--muted,#566880)}
@keyframes slclSpin{to{transform:rotate(360deg)}}
@keyframes slclPulse{0%,100%{transform:scale(1)}50%{transform:scale(.94)}}
@media (prefers-reduced-motion:reduce){#slcLoader .slcl-ring{animation-duration:2.4s}#slcLoader .slcl-mark img{animation:none}}
</style>
<noscript><style>#slcLoader{display:none!important}</style></noscript>
<script>(function(){var h=document.documentElement,MIN_MS=700,t0=Date.now(),shown=0;try{if(!sessionStorage.getItem("slc-splashed")){shown=1;h.classList.add("slc-splash");sessionStorage.setItem("slc-splashed","1")}}catch(e){}
if(!shown)return;var gone=0;function hide(){if(gone)return;gone=1;h.classList.add("slc-loaded");setTimeout(function(){h.classList.remove("slc-splash","slc-loaded")},450)}
function ready(){setTimeout(hide,Math.max(0,MIN_MS-(Date.now()-t0)))}
if(document.readyState==="complete")ready();else addEventListener("load",ready);setTimeout(hide,8000)})();</script>

</head>
